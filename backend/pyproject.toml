[tool.poetry]
name = "backend"
version = "0.1.0"
description = "FastAPI wrapper for Ollama chat API"
authors = ["Adam Larson <admlars2@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.123.10"
uvicorn = {extras = ["standard"], version = "^0.38.0"}
pydantic = "^2.12.5"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
