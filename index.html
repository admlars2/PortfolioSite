    <meta name="description" content="Adam Larson is a computer science graduate building software, data tools, and simulations for Earth science and other physical systems. Featured work includes Tectonic Planet Generator." />

    <meta name="theme-color" content="#140f24" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <meta name="twitter:title" content="Adam Larson | Software for Physical Systems" />

    <!-- Resource hints for external links -->
    <link rel="preconnect" href="https://github.com" crossorigin />
    <link rel="preconnect" href="https://www.linkedin.com" crossorigin />
    <link rel="dns-prefetch" href="https://github.com" />
    <link rel="dns-prefetch" href="https://www.linkedin.com" />
    
    <!-- Preload will be handled by React component for LCP image -->
    
    <title>Adam Larson | Scientific Software, Earth Data & Simulation</title>
    <script>
      // Apply theme immediately to prevent flash of wrong theme
      (function() {
        const saved = localStorage.getItem('theme');
        const theme = saved === 'light' || saved === 'dark' 
          ? saved 
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" defer></script>
  </body>
